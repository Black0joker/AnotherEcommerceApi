name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ECommerce!Pass2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ECommerce!Pass2026' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ECommerce.slnx

      - name: Build
        run: dotnet build ECommerce.slnx --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/ECommerce.UnitTests/ECommerce.UnitTests.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Run Architecture Tests
        run: dotnet test tests/ECommerce.ArchitectureTests/ECommerce.ArchitectureTests.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=architecture-tests.trx"

      - name: Run Integration Tests
        run: dotnet test tests/ECommerce.IntegrationTests/ECommerce.IntegrationTests.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=integration-tests.trx"
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=ECommerceDb_Test;User Id=sa;Password=ECommerce!Pass2026;TrustServerCertificate=True;"
          ConnectionStrings__Redis: "localhost:6379"
          JwtSettings__SecretKey: "CISuperSecretKeyThatIsAtLeast32CharactersLong!!"
          JwtSettings__Issuer: "ECommerce.Api"
          JwtSettings__Audience: "ECommerce.Client"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
          retention-days: 30

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ecommerce-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
